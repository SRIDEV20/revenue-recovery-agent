services:
  - type: web
    name: revenue-recovery-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
